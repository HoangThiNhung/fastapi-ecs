# File: .github/workflows/deploy-staging.yml

name: "Deploy to ECS (Staging)"

on:
  push:
    branches:
      - "staging"
jobs:
  deploy-backend:
    name: "Deploy Backend to ECS"
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      aws-region: ap-northeast-1
      cluster: nhunght-cluster
      service: nhunght-backend-service
      task-definition-file: ecs/task-denification-backend-staging.json
      container-name: backend
      image-repo-name: ecs-fargate/backend
      ecr-repo-url: 715841341879.dkr.ecr.ap-northeast-1.amazonaws.com
      context: backend
      deploy: true
      env: staging
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.STG_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STG_AWS_SECRET_ACCESS_KEY }}
  
  deploy-frontend:
    name: "Deploy Frontend to ECS (Staging)"
    needs: deploy-backend
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      aws-region: ap-northeast-1
      cluster: nhunght-cluster
      service: nhunght-frontend-service
      task-definition-file: ecs/task-denification-frontend-staging.json
      container-name: frontend
      image-repo-name: ecs-fargate/frontend
      ecr-repo-url: 715841341879.dkr.ecr.ap-northeast-1.amazonaws.com
      context: frontend
      deploy: true
      env: staging
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.STG_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STG_AWS_SECRET_ACCESS_KEY }}
